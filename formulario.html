 <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Entrega</title>
</head>
<body>

    <h1>Cadastro de Entrega</h1>

    <form action="processar.php" method="POST">

        <label for="codigo">Código:</label><br>
        <input type="text" id="codigo" name="codigo" required>
        <br><br>

        <label for="destinatario">Destinatário:</label><br>
        <input type="text" id="destinatario" name="destinatario" required>
        <br><br>

        <label for="cidade">Cidade:</label><br>
        <input type="text" id="cidade" name="cidade" required>
        <br><br>

        <label for="peso">Peso (kg):</label><br>
        <input type="number" id="peso" name="peso" step="0.01" min="0" required>
        <br><br>

        <button type="submit">Cadastrar</button>

    </form>

</body>
</html>
